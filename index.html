<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ESP32-C3 BLE Поток данных</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #log { width: 100%; height: 300px; font-family: monospace; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Прием данных с ESP32-C3 (Пила)</h1>
    <button class="btn" id="connectBtn">Подключиться по Bluetooth</button>
    <p>Скорость: <span id="speed">0</span> Кбайт/с</p>
    <textarea id="log" readonly></textarea>

    <script>
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        
        let totalBytes = 0;
        let lastTime = performance.now();

        // Считаем скорость передачи раз в секунду
        setInterval(() => {
            let now = performance.now();
            let dt = (now - lastTime) / 1000;
            let kbps = (totalBytes / 1024) / dt;
            document.getElementById('speed').innerText = kbps.toFixed(2);
            totalBytes = 0;
            lastTime = now;
        }, 1000);

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const logTxt = document.getElementById('log');
                logTxt.value += "Поиск устройства...\n";

                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32C3-Sawtooth' }],
                    optionalServices: [SERVICE_UUID]
                });

                logTxt.value += `Подключение к ${device.name}...\n`;
                const server = await device.gatt.connect();
                
                logTxt.value += "Получение сервиса...\n";
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                logTxt.value += "Получение характеристики...\n";
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                logTxt.value += "Подписка на уведомления...\n";
                await characteristic.startNotifications();
                
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const view = event.target.value; // DataView пакет
                    totalBytes += view.byteLength;

                    // Парсим бинарный буфер (массив int16)
                    let samples = [];
                    for (let i = 0; i < view.byteLength; i += 2) {
                        samples.push(view.getInt16(i, true)); // true для Little-Endian
                    }
                    
                    // Выводим только первую точку из пачки, чтобы браузер не завис от текста
                    logTxt.value = `Пакет: ${view.byteLength} байт. Первое значение пилы: ${samples[0]}\n` + logTxt.value.substring(0, 1000);
                });

                logTxt.value += "Успешно подключено! Идет прием данных...\n";
            } catch (error) {
                document.getElementById('log').value += `Ошибка: ${error}\n`;
            }
        });
    </script>
</body>
</html>
