<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE VA Meter</title>
    <!-- Библиотека для графиков SmoothieCharts -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #00adb5; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        button:hover { background: #007a80; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 8px; }
        .card.voltage { border-left: 5px solid #ff4d4d; }
        .card.current { border-left: 5px solid #4da6ff; }
        .value { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .sub-values { font-size: 12px; color: #aaa; }
        canvas { width: 100%; height: 200px; background: #1a1a1a; border-radius: 5px; margin-top: 10px; }
        #status { color: #888; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Дистанционный VA-Монитор</h2>
    <div id="status">Статус: Отключено</div>
    <button id="connectBtn">ПОДКЛЮЧИТЬСЯ К ESP32</button>

    <div class="data-grid">
        <div class="card voltage">
            <div>Напряжение (V)</div>
            <div class="value" id="vNow">0.00 В</div>
            <div class="sub-values">Min: <span id="vMin">0.00</span> | Max: <span id="vMax">0.00</span></div>
        </div>
        <div class="card current">
            <div>Ток (A)</div>
            <div class="value" id="iNow">0.000 А</div>
            <div class="sub-values">Min: <span id="iMin">0.000</span> | Max: <span id="iMax">0.000</span></div>
        </div>
    </div>

    <h4>График реального времени (100 мс)</h4>
    <canvas id="chartCanvas"></canvas>
</div>

<script>
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

let bleDevice = null;
let dataCharacteristic = null;

const smoothie = new SmoothieChart({
    grid: { strokeStyle:'#2c2c2c', fillStyle:'#1a1a1a', lineWidth: 1, millisPerLine: 1000, verticalSections: 6 },
    labels: { fillStyle:'#ffffff' },
    tooltip: true
});
smoothie.streamTo(document.getElementById('chartCanvas'), 500);

const lineVoltage = new TimeSeries();
const lineCurrent = new TimeSeries();

smoothie.addTimeSeries(lineVoltage, { strokeStyle:'rgba(255, 77, 77, 1)', fillStyle:'rgba(255, 77, 77, 0.1)', lineWidth:2 });
smoothie.addTimeSeries(lineCurrent, { strokeStyle:'rgba(77, 166, 255, 1)', fillStyle:'rgba(77, 166, 255, 0.1)', lineWidth:2 });

document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
        document.getElementById('status').innerText = "Статус: Поиск устройства...";
        
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
        });

        document.getElementById('status').innerText = "Статус: Подключение...";
        const server = await bleDevice.gatt.connect();

        document.getElementById('status').innerText = "Статус: Поиск сервиса...";
        const service = await server.getPrimaryService(SERVICE_UUID);

        document.getElementById('status').innerText = "Статус: Получение данных...";
        dataCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await dataCharacteristic.startNotifications();
        dataCharacteristic.addEventListener('characteristicvaluechanged', handleData);

        document.getElementById('status').innerText = "Статус: Подключено!";
        document.getElementById('connectBtn').style.display = 'none';

        bleDevice.addEventListener('gattserverdisconnected', () => {
            document.getElementById('status').innerText = "Статус: Соединение разорвано";
            document.getElementById('connectBtn').style.display = 'inline-block';
        });

    } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Ошибка: " + error.message;
    }
});

function handleData(event) {
    const value = event.target.value;
    
    const v_now = value.getInt16(0, true) / 100.0;
    const v_min = value.getInt16(2, true) / 100.0;
    const v_max = value.getInt16(4, true) / 100.0;
    
    const i_now = value.getInt16(6, true) / 1000.0;
    const i_min = value.getInt16(8, true) / 1000.0;
    const i_max = value.getInt16(10, true) / 1000.0;

    document.getElementById('vNow').innerText = v_now.toFixed(2) + " В";
    document.getElementById('vMin').innerText = v_min.toFixed(2);
    document.getElementById('vMax').innerText = v_max.toFixed(2);

    document.getElementById('iNow').innerText = i_now.toFixed(3) + " А";
    document.getElementById('iMin').innerText = i_min.toFixed(3);
    document.getElementById('iMax').innerText = i_max.toFixed(3);

    const nowTime = new Date().getTime();
    lineVoltage.append(nowTime, v_now);
    lineCurrent.append(nowTime, i_now);
}
</script>

</body>
</html>
