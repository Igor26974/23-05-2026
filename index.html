<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест BLE</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        button { background: #00adb5; color: white; border: none; padding: 20px 40px; font-size: 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #007a80; }
        #log { margin-top: 30px; color: #888; font-family: monospace; }
    </style>
</head>
<body>

    <h2>Тест вызова окна Bluetooth</h2>
    <br><br>
    <button id="testBtn">ОТКРЫТЬ ОКНО BLUETOOTH</button>
    <div id="log">Ожидание нажатия...</div>

<script>
document.getElementById('testBtn').addEventListener('click', function() {
    document.getElementById('log').innerText = "Кнопка нажата. Запрашиваю устройство...";

    // Самый прямой и примитивный вызов без фильтров и асинхронных задержек
    navigator.bluetooth.requestDevice({
        acceptAllDevices: true
    })
    .then(device => {
        document.getElementById('log').innerText = "Устройство выбрано: " + device.name;
    })
    .catch(error => {
        document.getElementById('log').innerText = "Ошибка или отмена: " + error.message;
        console.error(error);
    });
});
</script>

</body>
</html>
