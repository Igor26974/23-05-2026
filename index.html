<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чистый BLE VA Монитор</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 540px; margin: 0 auto; padding: 10px; }
        button { color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; width: 100%; box-sizing: border-box; transition: background 0.3s; }
        .btn-connect { background: #00adb5; }
        .btn-connect:hover { background: #007a80; }
        .btn-disconnect { background: #ff4d4d; }
        .btn-disconnect:hover { background: #cc3333; }
        .monitor { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: left; margin-bottom: 15px; }
        .param { font-size: 18px; margin: 8px 0; font-family: monospace; }
        .param span { font-weight: bold; color: #00adb5; }
        .chart-wrapper { position: relative; background: #1a1a1a; padding: 20px 45px 30px 45px; border-radius: 10px; border: 1px solid #333; box-sizing: border-box; }
        canvas { width: 100%; height: 200px; display: block; background: #151515; border-radius: 6px; }
        .axis-label { position: absolute; font-family: monospace; font-size: 11px; font-weight: bold; }
        .axis-v { left: 8px; color: #ff4d4d; text-align: right; width: 32px; }
        .axis-i { right: 8px; color: #4da6ff; text-align: left; width: 38px; }
        .axis-t { bottom: 8px; color: #888; font-size: 10px; width: 60px; text-align: center; }
        #log { margin-top: 15px; color: #888; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>BLE VA-Монитор (Встроенный граф)</h2>
    
    <button id="actionBtn" class="btn-connect">ПОДКЛЮЧИТЬСЯ И ВКЛЮЧИТЬ ГРАФИК</button>

    <div class="monitor">
        <div class="param">Напряжение: <span id="vNow">0.00</span> В</div>
        <div class="param">V Мин: <span id="vMin">0.00</span> | V Макс: <span id="vMax">0.00</span></div>
        <hr style="border-color: #333; margin: 10px 0;">
        <div class="param">Ток: <span id="iNow">0.000</span> А</div>
        <div class="param">I Мин: <span id="iMin">0.000</span> | I Макс: <span id="iMax">0.000</span></div>
    </div>

    <div class="chart-wrapper">
        <!-- Левая шкала (Вольты) -->
        <div class="axis-label axis-v" style="top: 20px;">15.0В</div>
        <div class="axis-label axis-v" style="top: 70px;">13.7В</div>
        <div class="axis-label axis-v" style="top: 120px;">12.5В</div>
        <div class="axis-label axis-v" style="top: 170px;">11.2В</div>
        <div class="axis-label axis-v" style="top: 210px;">10.0В</div>

        <canvas id="customChart" width="500" height="200"></canvas>

        <!-- Правая шкала (Амперы) -->
        <div class="axis-label axis-i" style="top: 20px;">5.00А</div>
        <div class="axis-label axis-i" style="top: 70px;">3.75А</div>
        <div class="axis-label axis-i" style="top: 120px;">2.50А</div>
        <div class="axis-label axis-i" style="top: 170px;">1.25А</div>
        <div class="axis-label axis-i" style="top: 210px;">0.00А</div>

        <!-- Нижняя шкала времени (бегущие секунды относительно старта) -->
        <div id="t-4" class="axis-label axis-t" style="left: 45px;">-4.0s</div>
        <div id="t-3" class="axis-label axis-t" style="left: 155px;">-3.0s</div>
        <div id="t-2" class="axis-label axis-t" style="left: 265px;">-2.0s</div>
        <div id="t-1" class="axis-label axis-t" style="left: 375px;">-1.0s</div>
        <div id="t-0" class="axis-label axis-t" style="right: 45px; color: #00adb5;">0.0s</div>
    </div>

    <div id="log">Статус: Ожидание подключения...</div>
</div>

<script>
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

let bleDevice = null;
let dataCharacteristic = null;
let isConnected = false;

const canvas = document.getElementById('customChart');
const ctx = canvas.getContext('2d');
const maxPoints = 50; 
const voltageHistory = [];
const currentHistory = [];
let secondsElapsed = 0.0;

function drawChart() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Сетка графика
    ctx.strokeStyle = '#262626';
    ctx.lineWidth = 1;
    for (let i = 40; i < canvas.height; i += 40) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }
    for (let i = 50; i < canvas.width; i += 50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }

    // Красная линия (Напряжение) 10В - 15В
    if (voltageHistory.length > 1) {
        ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i < voltageHistory.length; i++) {
            const x = (i / (maxPoints - 1)) * canvas.width;
            let v = voltageHistory[i];
            if(v < 10) v = 10; if(v > 15) v = 15;
            const y = canvas.height - ((v - 10) / 5) * canvas.height;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // Синяя линия (Ток) 0А - 5А
    if (currentHistory.length > 1) {
        ctx.strokeStyle = '#4da6ff'; ctx.lineWidth = 2; ctx.beginPath();
        for (let i = 0; i < currentHistory.length; i++) {
            const x = (i / (maxPoints - 1)) * canvas.width;
            let cap_i = currentHistory[i];
            if(cap_i < 0) cap_i = 0; if(cap_i > 5) cap_i = 5;
            const y = canvas.height - (cap_i / 5) * canvas.height;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
}

drawChart();

// Логика переключения кнопки Подключить / Отключить
document.getElementById('actionBtn').addEventListener('click', function() {
    if (!isConnected) {
        // Логика подключения
        document.getElementById('log').innerText = "Запрос устройства...";
        navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
        })
        .then(device => {
            bleDevice = device;
            document.getElementById('log').innerText = "Подключение к GATT...";
            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
            return bleDevice.gatt.connect();
        })
        .then(server => server.getPrimaryService(SERVICE_UUID))
        .then(service => service.getCharacteristic(CHARACTERISTIC_UUID))
        .then(characteristic => {
            dataCharacteristic = characteristic;
            return dataCharacteristic.startNotifications().then(() => {
                dataCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);
                
                // Переключаем кнопку в режим ОТКЛЮЧЕНИЯ
                isConnected = true;
                const btn = document.getElementById('actionBtn');
                btn.innerText = "ОТКЛЮЧИТЬ BLE VA МОНИТОР";
                btn.className = "btn-disconnect";
                document.getElementById('log').innerText = "Связь установлена! Поток запущен.";
            });
        })
        .catch(error => {
            document.getElementById('log').innerText = "Ошибка: " + error.message;
            console.error(error);
        });
    } else {
        // Логика ручного отключения
        if (bleDevice && bleDevice.gatt.connected) {
            bleDevice.gatt.disconnect();
        }
    }
});

function onDisconnected() {
    isConnected = false;
    const btn = document.getElementById('actionBtn');
    btn.innerText = "ПОДКЛЮЧИТЬСЯ И ВКЛЮЧИТЬ ГРАФИК";
    btn.className = "btn-connect";
    document.getElementById('log').innerText = "Статус: Соединение разорвано платой или пользователем.";
    voltageHistory.length = 0;
    currentHistory.length = 0;
    drawChart();
}

function handleIncomingData(event) {
    const buffer = event.target.value;
    
    if (buffer.byteLength >= 12) {
        const v_now = buffer.getInt16(0, true) / 100.0;
        const v_min = buffer.getInt16(2, true) / 100.0;
        const v_max = buffer.getInt16(4, true) / 100.0;
        
        const i_now = buffer.getInt16(6, true) / 1000.0;
        const i_min = buffer.getInt16(8, true) / 1000.0;
        const i_max = buffer.getInt16(10, true) / 1000.0;

        document.getElementById('vNow').innerText = v_now.toFixed(2);
        document.getElementById('vMin').innerText = v_min.toFixed(2);
        document.getElementById('vMax').innerText = v_max.toFixed(2);

        document.getElementById('iNow').innerText = i_now.toFixed(3);
        document.getElementById('iMin').innerText = i_min.toFixed(3);
        document.getElementById('iMax').innerText = i_max.toFixed(3);

        voltageHistory.push(v_now);
        currentHistory.push(i_now);

        if (voltageHistory.length > maxPoints) voltageHistory.shift();
        if (currentHistory.length > maxPoints) currentHistory.shift();

        // Динамическое обновление бегущей шкалы времени по оси X (пакеты идут раз в 100мс)
        secondsElapsed += 0.1;
        document.getElementById('t-4').innerText = (secondsElapsed - 4.0).toFixed(1) + "s";
        document.getElementById('t-3').innerText = (secondsElapsed - 3.0).toFixed(1) + "s";
        document.getElementById('t-2').innerText = (secondsElapsed - 2.0).toFixed(1) + "s";
        document.getElementById('t-1').innerText = (secondsElapsed - 1.0).toFixed(1) + "s";
        document.getElementById('t-0').innerText = secondsElapsed.toFixed(1) + "s";

        drawChart();
    }
}
</script>

</body>
</html>
